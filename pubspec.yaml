name: health
description: Wrapper for Apple's HealthKit on iOS and Google's Health Connect on Android.
version: 14.0.0
homepage: https://github.com/carp-dk/carp-health-flutter
repository: https://github.com/carp-dk/carp-health-flutter
issue_tracker: https://github.com/carp-dk/carp-health-flutter/issues
documentation: https://docs.carp.dk/packages/flutter-health-plugin

topics:
  - health
  - healthkit
  - healthconnect

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ">=0.18.0 <0.21.0"
  device_info_plus: "^12.1.0"
  json_annotation: ^4.9.0
  carp_serializable: ^2.0.1 # polymorphic json serialization

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: any

  # Using carp_serializable & json_serializable to auto generate json code (.g files) with this command:
  #   dart run build_runner build --delete-conflicting-outputs
  build_runner: any
  json_serializable: any
  mocktail: ^1.0.4
  mockito: ^5.4.5

flutter:
  config:
    enable-swift-package-manager: true
  plugin:
    platforms:
      android:
        package: cachet.plugins.health
        pluginClass: HealthPlugin
      ios:
        pluginClass: HealthPlugin
